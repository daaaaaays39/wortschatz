<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wortschatz">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Wortschatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#18202E; --muted:#5E6778; --line:#D5DBE4;
  --der:#2F5BD3; --die:#D2364B; --das:#23935A; --neutral:#8A93A6;
  --der-soft:#E3EAFB; --die-soft:#FBE4E7; --das-soft:#DFF3E8;
  --ok:#23935A; --ng:#D2364B;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --surface:#1B2230; --ink:#E8ECF3; --muted:#9AA3B5; --line:#2C3546;
    --der:#7097FF; --die:#FF6B7D; --das:#4CC98A; --neutral:#7D869A;
    --der-soft:#1E2A4A; --die-soft:#3A1F26; --das-soft:#173327; --ok:#4CC98A; --ng:#FF6B7D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1B2230; --ink:#E8ECF3; --muted:#9AA3B5; --line:#2C3546;
  --der:#7097FF; --die:#FF6B7D; --das:#4CC98A; --neutral:#7D869A;
  --der-soft:#1E2A4A; --die-soft:#3A1F26; --das-soft:#173327; --ok:#4CC98A; --ng:#FF6B7D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.de{font-family:"Literata",Georgia,"Times New Roman",serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--der);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 18px 4px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto}
.top h1{margin:0;font-family:"Literata",Georgia,serif;font-weight:600;font-size:1.4rem;letter-spacing:-.01em}
.levels{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:560px;margin:10px auto 0}
.lv{border:none;background:none;border-radius:999px;padding:6px 0;font-weight:700;font-size:.9rem;color:var(--muted)}
.top-row .ptext{font-size:.85rem;color:var(--muted)}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.meta{display:flex;justify-content:space-between;max-width:560px;margin:8px auto 0;font-size:.82rem;color:var(--muted)}
.bar{max-width:560px;margin:4px auto 0;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);transition:width .4s ease}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 4px;max-width:596px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:560px;margin:0 auto;padding:12px 18px calc(96px + env(safe-area-inset-bottom,0px))}

.card{position:relative;display:flex;background:var(--surface);border-radius:18px;min-height:330px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.band{flex:none;width:14px;background:var(--neutral)}
.g-der .band{background:var(--der)} .g-die .band{background:var(--die)} .g-das .band{background:var(--das)}
.card-body{flex:1;min-width:0;padding:22px 22px 24px;display:flex;flex-direction:column}
.kind{margin:0;font-size:.82rem;color:var(--muted)}
.word{margin:16px 0 0;font-size:2.4rem;line-height:1.15;font-weight:600;overflow-wrap:anywhere}
.art{font-weight:400;margin-right:.3em}
.c-der{color:var(--der)} .c-die{color:var(--die)} .c-das{color:var(--das)} .c-pl{color:var(--muted)}
.speak{align-self:flex-start;margin-top:14px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.88rem}
.hint{margin-top:auto;color:var(--muted);font-size:.9rem}
.back{margin-top:20px;animation:reveal .25s ease}
.ja{font-size:1.5rem;font-weight:700;margin:0}
.detail{margin:10px 0 0;color:var(--muted);font-size:.92rem}
.example{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.example .de{font-size:1.1rem;margin:0}
.example p{margin:2px 0 0}
.example .ex-ja{color:var(--muted);font-size:.9rem}
.ex-row{display:flex;gap:8px;align-items:flex-start}
.ex-row .txt{flex:1;min-width:0}
.ex-speak{flex:none;border:none;background:none;font-size:1rem;padding:2px 4px}
.ex-btn{margin-top:18px;border:1px dashed var(--line);background:transparent;border-radius:12px;padding:10px 14px;font-size:.92rem;width:100%;text-align:left;color:var(--muted)}
.ex-wait{margin-top:18px;color:var(--muted);font-size:.9rem}
.ex-redo{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:.8rem;padding:6px 0 0}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.back{animation:none}.bar span{transition:none}}

.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.row.three{grid-template-columns:auto 1fr 1fr}
.btn.back-btn{padding:15px 16px;font-size:.95rem}
.btn:disabled{opacity:.35}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:15px 10px;font-weight:600;font-size:1rem}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.full{width:100%;margin-top:16px}
.count{text-align:center;color:var(--muted);font-size:.85rem;margin:12px 0 0}

.prompt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.prompt .word{margin-top:6px;font-size:2.1rem}
.score{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:10px}
.options{display:grid;gap:10px;margin-top:14px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-size:1.05rem}
.opt.correct{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.opt.wrong{border-color:var(--ng);box-shadow:inset 0 0 0 2px var(--ng);opacity:.85}
.feedback{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.feedback strong{display:block;margin-bottom:4px}
.ok{color:var(--ok)} .ng{color:var(--ng)}
.articles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.abtn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 0;font-family:"Literata",Georgia,serif;font-size:1.4rem;font-weight:600}
.abtn.der{color:var(--der)} .abtn.die{color:var(--die)} .abtn.das{color:var(--das)}
.abtn.correct.der{background:var(--der-soft);border-color:var(--der)}
.abtn.correct.die{background:var(--die-soft);border-color:var(--die)}
.abtn.correct.das{background:var(--das-soft);border-color:var(--das)}
.abtn.wrong{opacity:.4;text-decoration:line-through}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}

.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:1rem;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:6px}
.item .txt{flex:1;min-width:0}
.item .de{font-size:1.06rem;font-weight:600;margin:0;overflow-wrap:anywhere}
.item .ja-s{margin:0;color:var(--muted);font-size:.86rem}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:.95rem;font-weight:700;color:transparent}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.mini-speak{flex:none;border:none;background:transparent;font-size:1.05rem;padding:6px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.more{display:block;width:100%;margin-top:6px}
.reset{display:block;margin:28px auto 0;border:none;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem}

/* modes */
body[data-mode="home"] .top, body[data-mode="home"] .chips, body[data-mode="home"] #view, body[data-mode="home"] .tabs,
body[data-mode="grammar"] .top, body[data-mode="grammar"] .chips, body[data-mode="grammar"] #view, body[data-mode="grammar"] .tabs { display:none }
body:not([data-mode="home"]) #home, body:not([data-mode="grammar"]) #grammar { display:none }
.home-btn{border:none;background:none;padding:6px 6px 6px 0;margin-right:2px;display:inline-flex;align-items:center;min-height:44px;color:var(--ink)}
.top h1{display:flex;align-items:center}
/* home */
#home{max-width:560px;margin:0 auto;padding:36px 20px 40px;display:flex;flex-direction:column;gap:20px}
.home-title{margin:0;font-family:"Literata",Georgia,serif;font-weight:600;font-size:2.4rem;letter-spacing:-.02em}
.home-bars{display:flex;gap:6px;margin-top:6px}
.home-bars span{width:22px;height:6px;border-radius:3px}
.home-q{margin:8px 0 0;color:var(--muted)}
.course{display:flex;flex-direction:column;gap:14px;width:100%;text-align:left;border-radius:22px;padding:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.course.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.course .row1{display:flex;justify-content:space-between;align-items:center;font-family:"Literata",Georgia,serif;font-size:.95rem;opacity:.75}
.course .name{font-size:1.6rem;font-weight:800;display:block}
.course .desc{font-size:.9rem;opacity:.8;line-height:1.6;display:block;margin-top:2px}
.course .pills{display:flex;gap:8px;flex-wrap:wrap}
.course .pills span{font-size:.75rem;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--bg);color:var(--ink)}
.course.dark .pills span{background:rgba(127,127,127,.28);color:var(--bg)}
.course .prog{display:flex;justify-content:space-between;font-size:.8rem;opacity:.85}
.course .pbar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.course.dark .pbar{background:rgba(127,127,127,.35)}
.course .pbar i{display:block;height:100%;background:var(--ink)}
.course.dark .pbar i{background:var(--bg)}
.home-note{text-align:center;color:var(--muted);font-size:.82rem;margin:0}
/* grammar */
#grammar{max-width:560px;margin:0 auto;padding:8px 20px 40px;display:flex;flex-direction:column;gap:16px}
.g-back{align-self:flex-start;border:none;background:none;display:inline-flex;align-items:center;gap:4px;font-size:.95rem;min-height:44px;padding:0;color:var(--ink)}
.g-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.g-head h1{margin:0;font-family:"Literata",Georgia,serif;font-weight:600;font-size:1.6rem}
.g-head span{font-size:.82rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:none;background:none;border-radius:999px;padding:7px 0;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ink)}
.next-card{background:var(--ink);color:var(--bg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px}
.next-card small{opacity:.8;font-size:.82rem}
.next-card h2{margin:0;font-size:1.35rem}
.next-card .de{font-size:1.15rem;margin:0}
.next-card .btn{margin-top:6px;background:var(--bg);color:var(--ink);border:none}
.unit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:58px;color:var(--ink)}
.unit .num{flex:none;width:28px;text-align:center;font-family:"Literata",Georgia,serif;font-weight:600;font-size:1.05rem;color:var(--muted)}
.unit .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.unit .tx b{font-size:.95rem}
.unit .tx span{font-family:"Literata",Georgia,serif;font-size:.88rem;color:var(--muted)}
.mark{flex:none;min-width:30px;height:30px;border-radius:999px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;padding:0 4px}
.mark.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.soon{color:var(--muted);text-align:center;padding:30px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps div{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted)}
.steps div i{height:4px;border-radius:2px;background:var(--line)}
.steps div.on{color:var(--ink);font-weight:700}
.steps div.on i{background:var(--ink)}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.gcard h2{margin:0;font-size:1.1rem}
.gcard p{margin:0;line-height:1.8}
.hl{color:var(--der);font-weight:700}
.tablewrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.gtable{width:100%;border-collapse:collapse;font-size:.95rem}
.gtable th{background:var(--bg);font-size:.78rem;color:var(--muted);font-weight:700;padding:8px;text-align:left;white-space:nowrap}
.gtable td{border-top:1px solid var(--line);padding:9px 8px;font-family:"Literata",Georgia,serif}
.gtable td:first-child{font-family:inherit;font-size:.85rem}
.point{background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 16px;line-height:1.7}
.hints{margin:0;padding-left:1.2em;line-height:1.8;color:var(--muted);font-size:.92rem}
.gex{display:flex;gap:10px;align-items:flex-start;padding-top:12px;border-top:1px solid var(--line)}
.gcard h2 + .gex{border-top:none;padding-top:0}
.gex .tx{flex:1}
.gex .de{font-size:1.12rem;margin:0}
.gex .ja2{font-size:.88rem;color:var(--muted);margin:2px 0 0}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1rem}
.qbar{display:grid;gap:4px}
.qbar i{height:6px;border-radius:3px;background:var(--line)}
.qbar i.ok{background:var(--ok)} .qbar i.ng{background:var(--ng)} .qbar i.cur{background:var(--ink)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.qcard .lead{font-size:.82rem;color:var(--muted)}
.qcard .qde{margin:0;font-size:1.5rem;line-height:1.5;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:80px;border-bottom:2.5px solid var(--der);text-align:center;color:var(--der);font-weight:600}
.qchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qchoices.long{grid-template-columns:1fr}
.qc{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:"Literata",Georgia,serif;font-size:1.15rem;font-weight:600;color:var(--ink);padding:8px}
.qchoices.long .qc{font-size:1.02rem;text-align:left;padding:12px 14px}
.qc.ok{border-color:var(--ok);background:var(--das-soft)}
.qc.ng{border-color:var(--ng);background:var(--die-soft);text-decoration:line-through}
.qc:disabled:not(.ok):not(.ng){opacity:.45}
.fb ol{margin:0;padding-left:1.3em;line-height:1.8}
.fb .ttl{font-weight:800;font-size:1.02rem}
.fb .ttl.ok{color:var(--ok)} .fb .ttl.ng{color:var(--ng)}
.result{text-align:center;align-items:center}
.result .big{font-family:"Literata",Georgia,serif;font-size:3rem;font-weight:600;margin:0}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{border:none;background:none;padding:10px 4px 12px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab b{font-family:"Literata",Georgia,serif;font-size:1.05rem;font-weight:600;line-height:1.3}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] b{color:var(--der)}
</style>
</head>
<body data-mode="home">
<section id="home"></section>
<section id="grammar"></section>
<header class="top">
  <div class="top-row">
    <h1><button class="home-btn" data-action="goHome" aria-label="コース選択に戻る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>Wortschatz</h1>
    <span class="ptext" id="ptext"></span>
  </div>
  <div class="levels" id="levels" role="group" aria-label="レベル"></div>
  <div class="meta"><span id="lvinfo"></span><span id="lvnote"></span></div>
  <div class="bar" aria-hidden="true"><span id="pbar"></span></div>
</header>
<nav class="chips" id="chips" aria-label="品詞"></nav>
<main id="view"></main>
<nav class="tabs" aria-label="モード">
  <button class="tab" data-tab="card"><b>Karte</b>カード</button>
  <button class="tab" data-tab="quiz"><b>Quiz</b>意味クイズ</button>
  <button class="tab" data-tab="art"><b>der·die·das</b>性クイズ</button>
  <button class="tab" data-tab="list"><b>Liste</b>一覧</button>
</nav>

  } catch(e) {}
}

// ---------- 意味クイズ ----------
function newQuiz(){
  const list = filtered();
  if (!list.length) { quiz = null; return; }
  const unk = list.filter(w => !known[key(w)]);
  const w = pick(unk.length && Math.random() < 0.75 ? unk : list);
  const same = inLevel().filter(x => x !== w && x.p === w.p && x.ja !== w.ja);
  let others = shuffle(same).slice(0, 3);
  if (others.length < 3) others = others.concat(shuffle(W.filter(x => x !== w && x.ja !== w.ja && !others.includes(x))).slice(0, 3 - others.length));
  quiz = {w, options: shuffle([w, ...others]), picked: null};
}
function renderQuiz(){
  if (!quiz) newQuiz();
  if (!quiz) { view.innerHTML = '<p class="empty">この組み合わせには単語がありません。</p>'; return; }
  const {w, options, picked} = quiz, done = picked !== null, right = done && options[picked] === w;
  view.innerHTML = `
    <div class="score"><span>意味を選んでください</span><span>正解 ${qScore.ok} / ${qScore.all}</span></div>
    <div class="prompt">
      <p class="kind">${kind(w)}</p>
      <p class="word de">${artHTML(w)}${w.de}</p>
      <button class="speak" data-action="speak" data-text="${esc(spoken(w))}">🔊 発音を聞く</button>
    </div>
    <div class="options">
      ${options.map((o, i) => {
        const c = done && o === w ? 'correct' : done && i === picked ? 'wrong' : '';
        return `<button class="opt ${c}" data-action="pick" data-i="${i}" ${done ? 'disabled' : ''}>${o.ja}</button>`;
      }).join('')}
    </div>
    ${done ? `<div class="feedback">
      <strong class="${right ? 'ok' : 'ng'}">${right ? '正解！' : '残念、正解は「' + w.ja + '」'}</strong>
      ${detail(w) ? `<span class="detail">${detail(w)}</span>` : ''}${exampleHTML(w)}
    </div>
    <div class="row">
      <button class="btn" data-action="markQuiz">${known[key(w)] ? '「覚えた」を外す' : '覚えたにする'}</button>
      <button class="btn primary" data-action="nextQuiz">次の問題</button>
    </div>` : ''}`;
}

// ---------- der/die/das クイズ ----------
function newArt(){
  let list = inLevel().filter(w => w.p === 'n' && isArt(w.g));
  const unk = list.filter(w => !known[key(w)]);
  aq = {w: pick(unk.length && Math.random() < 0.75 ? unk : list), picked: null};
}
function artHint(w){
  const d = w.de.toLowerCase();
  if (/(ung|heit|keit|schaft|ion|tät|ik)$/.test(d) && w.g === 'die') return '-ung, -heit, -keit, -schaft, -ion, -tät で終わる名詞は、ほぼ必ず die です。';
  if (/(chen|lein)$/.test(d)) return '-chen, -lein で終わる名詞は、必ず das です。';
  if (/(ment|um)$/.test(d) && w.g === 'das') return '-ment, -um で終わる名詞は das が多いです。';
  if (/(ling|ismus|or)$/.test(d) && w.g === 'der') return '-ling, -ismus, -or で終わる名詞は der が多いです。';
  if (d.endsWith('in') && w.g === 'die') return '女性を表す -in で終わる名詞は die です。';
  if (d.endsWith('e') && w.g === 'die') return '-e で終わる名詞は die が多いです（例外もあります）。';
  if (/(er)$/.test(d) && w.g === 'der') return '人や道具を表す -er で終わる名詞は der が多いです。';
  if (/^ge/.test(d) && w.g === 'das') return 'Ge- で始まる名詞は das が多いです。';
  if (w.de.includes('-') || /[a-zäöü][A-ZÄÖÜ]/.test(w.de)) return '';
  return '性は意味から決まらないことが多いので、「' + w.g + ' ' + w.de + '」とセットで覚えるのがコツです。';
}
function compoundHint(w){
  // 複合語は最後の単語の性になる
  const nouns = W.filter(x => x.p === 'n' && isArt(x.g) && x.de.length >= 3 && x.de !== w.de && w.de.endsWith(x.de.toLowerCase()) );
  if (!nouns.length) return '';
  const last = nouns.sort((a,b) => b.de.length - a.de.length)[0];
  return `くっついた単語は、最後の単語の性になります（${last.g} ${last.de}）。`;
}
function renderArt(){
  if (!aq) newArt();
  const {w, picked} = aq, done = picked !== null;
  const hint = done ? (compoundHint(w) || artHint(w)) : '';
  view.innerHTML = `

    <div class="prompt">
      <p class="kind">${w.ja}</p>
      <p class="word de">${done ? artHTML(w) : '<span class="art c-pl">___</span>'}${w.de}</p>
      <button class="speak" data-action="speak" data-text="${esc(done ? spoken(w) : w.de)}">🔊 発音を聞く</button>
    </div>
    <div class="articles">
      ${['der','die','das'].map(a => {
        const c = a + (done && a === w.g ? ' correct' : done && a === picked ? ' wrong' : '');
        return `<button class="abtn ${c}" data-action="art" data-a="${a}" ${done ? 'disabled' : ''}>${a}</button>`;
      }).join('')}
    </div>
    ${done ? `<div class="feedback">
      <strong class="${picked === w.g ? 'ok' : 'ng'}">${picked === w.g ? '正解！' : '正解は ' + w.g + '（' + G_NAME[w.g] + '）'}</strong>
      ${hint ? `<span class="detail">${hint}</span>` : ''}
      ${w.pl ? `<p class="detail">${detail(w)}</p>` : ''}
    </div>
    <button class="btn primary full" data-action="nextArt">次の問題</button>` : `
    <div class="legend"><span><i style="background:var(--der)"></i>der 男性</span><span><i style="background:var(--die)"></i>die 女性</span><span><i style="background:var(--das)"></i>das 中性</span></div>`}`;
}

// ---------- 一覧 ----------
function listItems(){
  const q = listQuery.trim().toLowerCase();
  const list = q ? W.filter(w => w.de.toLowerCase().includes(q) || w.ja.includes(q)) : filtered();
  return list;
}
function itemHTML(w){
  return `<div class="item">
    <button class="mini-speak" data-action="speak" data-text="${esc(spoken(w))}" aria-label="発音を聞く">🔊</button>
    <div class="txt"><p class="de">${artHTML(w)}${w.de}</p><p class="ja-s">${w.ja}${listQuery ? '・' + w.lv.toUpperCase() : ''}</p></div>
    <button class="check" data-action="toggle" data-id="${esc(key(w))}" aria-pressed="${!!known[key(w)]}" aria-label="覚えた">✓</button>
  </div>`;
}
function renderList(){
  view.innerHTML = `<input class="search" id="search" type="search" placeholder="ドイツ語か日本語で探す（全レベル）" value="${esc(listQuery)}" autocomplete="off" autocapitalize="off" spellcheck="false"><div id="items"></div>`;
  renderItems();
  document.getElementById('search').addEventListener('input', e => { listQuery = e.target.value; listLimit = 80; renderItems(); });
}
function renderItems(){
  const list = listItems(), box = document.getElementById('items');
  if (!list.length) { box.innerHTML = '<p class="empty">見つかりませんでした。つづりを変えて探してみてください。</p>'; return; }
  box.innerHTML = list.slice(0, listLimit).map(itemHTML).join('') +
    (list.length > listLimit ? `<button class="btn more" data-action="more">さらに表示（残り ${list.length - listLimit}語）</button>` : '') +
    (listQuery ? '' : '<button class="reset" data-action="reset">このレベルの「覚えた」記録を消す</button>');
}

// ---------- コース選択 ----------
let mode = 'home';
const BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
const NEXT = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const gTotal = () => GRAMMAR_LEVELS.reduce((s, l) => s + l[2], 0);
function renderHome(){
  const knownN = W.filter(w => known[key(w)]).length;
  const doneN = Object.keys(gram.done).length;
  const nextU = GRAMMAR.find(u => !gram.done[u.id]);
  document.getElementById('home').innerHTML = `
    <div>
      <h1 class="home-title">Wortschatz</h1>
      <div class="home-bars" aria-hidden="true"><span style="background:var(--der)"></span><span style="background:var(--die)"></span><span style="background:var(--das)"></span></div>
      <p class="home-q">今日はどちらを学びますか？</p>
    </div>
    <button class="course" data-action="goVocab">
      <span class="row1"><span>Wortschatz</span>${NEXT}</span>
      <span><span class="name">単語コース</span><span class="desc">カード・クイズ・der/die/das で単語を覚える</span></span>
      <span class="pills"><span>A1〜C1</span><span>${W.length.toLocaleString()}語</span><span>全単語に例文</span></span>
      <span><span class="prog"><span>前回：${lv.toUpperCase()}</span><span>覚えた ${knownN.toLocaleString()}語</span></span><span class="pbar"><i style="width:${knownN / W.length * 100}%"></i></span></span>
    </button>
    <button class="course dark" data-action="goGrammar">
      <span class="row1"><span>Grammatik</span>${NEXT}</span>
      <span><span class="name">文法コース</span><span class="desc">「なぜそうなるか」から学ぶ説明と練習問題</span></span>
      <span class="pills"><span>A1〜B1</span><span>${gTotal()}単元</span></span>
      <span><span class="prog"><span>${nextU ? '次：第' + nextU.n + '課 ' + nextU.title : 'A1はすべて完了'}</span><span>${doneN} / ${gTotal()}単元</span></span><span class="pbar"><i style="width:${doneN / gTotal() * 100}%"></i></span></span>
    </button>
    <p class="home-note">それぞれのコースの中から、いつでもここに戻れます</p>`;
}

// ---------- 文法コース ----------
let gLv = 'a1', gView = 'list', gUnit = null, gp = null;
const unitOf = id => GRAMMAR.find(u => u.id === id);
function renderGrammar(){
  const el = document.getElementById('grammar');
  el.innerHTML = gView === 'list' ? gList() : gView === 'lesson' ? gLesson() : gView === 'practice' ? gPractice() : gResult();
}
function gList(){
  const units = GRAMMAR.filter(u => u.lv === gLv);
  const lvInfo = GRAMMAR_LEVELS.find(l => l[0] === gLv);
  const done = units.filter(u => gram.done[u.id] != null).length;
  const next = units.find(u => gram.done[u.id] == null);
  let body;
  if (!units.length) body = `<div class="soon">${lvInfo[1]}（${lvInfo[2]}単元）は準備中です。</div>`;
  else body = (next ? `<div class="next-card">
      <small>${done ? '次はここから' : 'ここから始めましょう'}　第${next.n}課</small>
      <h2>${next.title}</h2>
      <p class="de">${next.ex}</p>
      <button class="btn" data-action="gOpen" data-id="${next.id}">${done ? '続きから始める' : '始める'}</button>
    </div>` : '') +
    `<h3 style="margin:6px 0 0;font-size:.9rem;color:var(--muted)">${lvInfo[1]}の単元</h3>` +
    units.map(u => {
      const sc = gram.done[u.id];
      return `<button class="unit" data-action="gOpen" data-id="${u.id}">
        <span class="num">${u.n}</span>
        <span class="tx"><b>${u.title}</b><span>${u.ex}</span></span>
        <span class="mark ${sc != null ? 'ok' : ''}">${sc != null ? sc + '/8' : ''}</span>
      </button>`;
    }).join('');
  return `<button class="g-back" data-action="goHome">${BACK}コース選択</button>
    <div class="g-head"><h1>Grammatik</h1><span>${lvInfo[1]}：${done} / ${lvInfo[2]}単元</span></div>
    <div class="seg">${GRAMMAR_LEVELS.map(([k, l]) => `<button data-action="gLv" data-glv="${k}" aria-pressed="${k === gLv}">${l}</button>`).join('')}</div>
    <div class="gbar"><i style="width:${done / lvInfo[2] * 100}%"></i></div>
    ${body}`;
}
function stepsHTML(n){
  return `<div class="steps">${['説明','例文','練習'].map((s, i) => `<div class="${i < n ? 'on' : ''}"><i></i>${i + 1} ${s}</div>`).join('')}</div>`;
}
function gLesson(){
  const u = unitOf(gUnit);
  const tb = u.table ? `<div class="tablewrap"><table class="gtable"><thead><tr>${u.table.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${u.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '';
  return `<button class="g-back" data-action="gList">${BACK}単元の一覧</button>
    <div class="g-head"><h1 style="font-family:inherit;font-weight:800">${u.title}</h1><span>${u.lv.toUpperCase()} 第${u.n}課</span></div>
    ${stepsHTML(2)}
    <section class="gcard"><h2>しくみ</h2>${u.intro.map(p => `<p>${p}</p>`).join('')}</section>
    <section class="gcard"><h2>形のまとめ</h2>${tb}<div class="point">${u.point}</div>
      ${u.hints ? `<p style="font-weight:700;margin-top:4px">見分けるヒント</p><ul class="hints">${u.hints.map(h => `<li>${h}</li>`).join('')}</ul>` : ''}</section>
    <section class="gcard"><h2>例文で確かめる</h2>
      ${u.examples.map(x => `<div class="gex"><div class="tx"><p class="de">${x.de}</p><p class="ja2">${x.ja}</p></div><button class="round" data-action="speak" data-text="${esc(x.say)}" aria-label="発音を聞く">🔊</button></div>`).join('')}
    </section>
    <button class="btn primary full" data-action="gStart">練習問題へ進む（${u.questions.length}問）</button>`;
}
function startPractice(){
  const u = unitOf(gUnit);
  gp = { queue: u.questions.map((q, i) => ({i, retry: false, choices: shuffle(q.choices)})), pos: 0, picked: null, first: u.questions.map(() => null) };
}
function gPractice(){
  const u = unitOf(gUnit), it = gp.queue[gp.pos], q = u.questions[it.i];
  const done = gp.picked !== null, right = done && gp.picked === q.a;
  const segs = u.questions.map((_, i) => `<i class="${gp.first[i] === true ? 'ok' : gp.first[i] === false ? 'ng' : i === it.i ? 'cur' : ''}"></i>`).join('');
  const blank = q.q.includes('___');
  const qtext = blank ? q.q.replace('___', done ? `<span class="blank">${q.a}</span>` : '<span class="blank">&nbsp;</span>') : '';
  return `<button class="g-back" data-action="gBackLesson">${BACK}説明に戻る</button>
    <div class="g-head"><span>${it.retry ? 'もう一度チャレンジ' : '問題 ' + (it.i + 1) + ' / ' + u.questions.length}</span><span>${u.title}</span></div>
    <div class="qbar" style="grid-template-columns:repeat(${u.questions.length},1fr)">${segs}</div>
    <section class="qcard">
      <span class="lead">${blank ? '空欄に入る形を選んでください' : '正しい文を選んでください'}${q.hint ? '（' + q.hint + '）' : ''}</span>
      ${blank ? `<p class="qde de">${qtext}</p>` : ''}
      <span style="color:var(--muted)">${q.ja}</span>
    </section>
    <div class="qchoices ${q.long ? 'long' : ''}">
      ${it.choices.map(c => {
        const cls = done && c === q.a ? 'ok' : done && c === gp.picked ? 'ng' : '';
        return `<button class="qc ${cls}" data-action="gPick" data-c="${esc(c)}" ${done ? 'disabled' : ''}>${c}</button>`;
      }).join('')}
    </div>
    ${done ? `<section class="gcard fb">
      <span class="ttl ${right ? 'ok' : 'ng'}">${right ? '正解！' : '惜しい！正解は ' + q.a}</span>
      <ol>${q.why.map(w => `<li>${w}</li>`).join('')}</ol>
      ${!right && !it.retry ? '<span style="font-size:.82rem;color:var(--muted)">この問題は、最後にもう一度出てきます。</span>' : ''}
    </section>
    <button class="btn primary full" data-action="gNext">${gp.pos + 1 < gp.queue.length ? '次の問題' : '結果を見る'}</button>` : ''}`;
}
function gResult(){
  const u = unitOf(gUnit);
  const score = gp.first.filter(x => x === true).length, total = u.questions.length;
  const next = GRAMMAR.find(x => x.lv === u.lv && x.n === u.n + 1);
  const msg = score === total ? 'パーフェクト！' : score >= total - 2 ? 'よくできました！' : 'もう一度説明を読んで、再挑戦してみましょう。';
  return `<button class="g-back" data-action="gList">${BACK}単元の一覧</button>
    <section class="gcard result">
      <span style="color:var(--muted)">第${u.n}課 ${u.title}</span>
      <p class="big">${score} / ${total}</p>
      <span>${msg}</span>
      <span style="font-size:.82rem;color:var(--muted)">最初の答えで正解した数です。この単元に完了のしるしがつきました。</span>
    </section>
    ${next ? `<button class="btn primary full" data-action="gOpen" data-id="${next.id}">次の単元へ：${next.title}</button>` : '<button class="btn primary full" data-action="gList">単元の一覧へ</button>'}
    <button class="btn full" data-action="gStart">もう一度練習する</button>`;
}

function render(){
  document.body.dataset.mode = mode;
  if (mode === 'home') { renderHome(); window.scrollTo(0, 0); return; }
  if (mode === 'grammar') { renderGrammar(); return; }
  renderTop();
  setTimeout(refreshEx, 0);
  if (tab === 'card') renderCard();
  else if (tab === 'quiz') renderQuiz();
  else if (tab === 'art') renderArt();
  else renderList();
}
function resetModes(){ buildDeck(); quiz = null; aq = null; listLimit = 80; save(); }

// ---------- 操作 ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-cat],[data-lv],[data-action]');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; if (tab === 'card') buildDeck(); window.scrollTo(0, 0); return render(); }
  if (t.dataset.lv) { lv = t.dataset.lv; resetModes(); window.scrollTo(0, 0); return render(); }
  if (t.dataset.cat) { cat = t.dataset.cat; listQuery = ''; resetModes(); return render(); }
  const a = t.dataset.action;
  if (a === 'speak') return say(t.dataset.text);
  if (a === 'goHome') { mode = 'home'; return render(); }
  if (a === 'goVocab') { mode = 'vocab'; buildDeck(); window.scrollTo(0, 0); return render(); }
  if (a === 'goGrammar') { mode = 'grammar'; gView = 'list'; window.scrollTo(0, 0); return render(); }
  if (a === 'gLv') { gLv = t.dataset.glv; return render(); }
  if (a === 'gList') { gView = 'list'; window.scrollTo(0, 0); return render(); }
  if (a === 'gOpen') { gUnit = t.dataset.id; gram.last = gUnit; saveGram(); gView = 'lesson'; window.scrollTo(0, 0); return render(); }
  if (a === 'gBackLesson') { gView = 'lesson'; window.scrollTo(0, 0); return render(); }
  if (a === 'gStart') { startPractice(); gView = 'practice'; window.scrollTo(0, 0); return render(); }
  if (a === 'gPick') {
    const u = unitOf(gUnit), it = gp.queue[gp.pos], q = u.questions[it.i];
    gp.picked = t.dataset.c;
    const right = gp.picked === q.a;
    if (gp.first[it.i] === null) gp.first[it.i] = right;
    if (!right && !it.retry) gp.queue.push({i: it.i, retry: true, choices: shuffle(q.choices)});
    const spoken = q.q.includes('___') && !/[ぁ-んァ-ヶ一-龯]/.test(q.q) ? q.q.replace('___', q.a).replace(/ – /g, '. ') : (q.long ? q.a : '');
    if (spoken) say(spoken);
    return render();
  }
  if (a === 'gNext') {
    gp.pos++; gp.picked = null;
    if (gp.pos >= gp.queue.length) {
      const u = unitOf(gUnit), score = gp.first.filter(x => x === true).length;
      gram.done[u.id] = Math.max(score, gram.done[u.id] || 0); saveGram();
      gView = 'result';
    }
    window.scrollTo(0, 0); return render();
  }

  if (a === 'flip') { flipped = !flipped; renderCard(); return refreshEx(); }
  if (a === 'makeEx') { const w = currentWord(); if (w) makeEx(w); return; }
  if (a === 'known' || a === 'again') {
    const w = deck[di];
    if (a === 'known') known[key(w)] = true; else delete known[key(w)];
    save(); di++; flipped = false; return render();
  }
  if (a === 'restart') { buildDeck(); return render(); }
  if (a === 'prev') { if (di > 0) { di--; flipped = false; } return render(); }
  if (a === 'pick') {
    quiz.picked = +t.dataset.i; qScore.all++;
    if (quiz.options[quiz.picked] === quiz.w) qScore.ok++;
    say(spoken(quiz.w)); renderQuiz(); return refreshEx();
  }
  if (a === 'markQuiz') { const k = key(quiz.w); if (known[k]) delete known[k]; else known[k] = true; save(); return render(); }
  if (a === 'nextQuiz') { newQuiz(); return renderQuiz(); }
  if (a === 'art') {
    aq.picked = t.dataset.a; aScore.all++;
    if (aq.picked === aq.w.g) aScore.ok++;
    say(spoken(aq.w)); return renderArt();
  }
  if (a === 'nextArt') { newArt(); return renderArt(); }
  if (a === 'toggle') {
    const id = t.dataset.id;
    if (known[id]) delete known[id]; else known[id] = true;
    save(); renderTop();
    t.setAttribute('aria-pressed', !!known[id]); return;
  }
  if (a === 'more') { listLimit += 200; return renderItems(); }
  if (a === 'reset') {
    if (confirm(lv.toUpperCase() + ' の「覚えた」記録をすべて消しますか？')) { inLevel().forEach(w => delete known[key(w)]); save(); buildDeck(); render(); }
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card')) { e.preventDefault(); flipped = !flipped; renderCard(); }
});

buildDeck();
render();

// オフラインで使えるようにする
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
</script>
</body>
</html>
